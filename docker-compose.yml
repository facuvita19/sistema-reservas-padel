services:
  mysql:
    image: mysql:8.4
    container_name: padel-mysql
    restart: unless-stopped
    environment:
      TZ: "America/Argentina/Buenos_Aires"
      MYSQL_DATABASE: "${MYSQL_DATABASE}"
      MYSQL_USER: "${MYSQL_USER}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - padel_mysql_data:/var/lib/mysql
      - ./database/docker-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - 'MYSQL_PWD="$${MYSQL_ROOT_PASSWORD}" mysqladmin ping -h localhost -uroot --silent'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: padel-api
    restart: unless-stopped
    environment:
      TZ: "America/Argentina/Buenos_Aires"
      DB_URL: "jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Argentina/Buenos_Aires"
      DB_USER: "${MYSQL_USER}"
      DB_PASSWORD: "${MYSQL_PASSWORD}"
      VENCIMIENTOS_INTERVALO_SEGUNDOS: "30"
      API_RECUPERACION_MOSTRAR_TOKEN: "false"
      API_WEB_PUBLICA_URL: "http://localhost:4321/"
      SMTP_HOST: "${SMTP_HOST}"
      SMTP_PORT: "${SMTP_PORT}"
      SMTP_USER: "${SMTP_USER}"
      SMTP_PASSWORD: "${SMTP_PASSWORD}"
      SMTP_FROM_EMAIL: "${SMTP_FROM_EMAIL}"
      SMTP_FROM_NAME: "${SMTP_FROM_NAME}"
      SMTP_STARTTLS: "${SMTP_STARTTLS}"
      SMTP_SSL: "${SMTP_SSL}"
      SMTP_TIMEOUT_MS: "${SMTP_TIMEOUT_MS}"
      
      
      JAVA_TOOL_OPTIONS: "-Dapi.port=8080 -Dapi.cors.origen=${WEB_ORIGIN} -Duser.timezone=America/Argentina/Buenos_Aires"
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

  web:
   build:
     context: ./web-publica-v2
     dockerfile: Dockerfile
   container_name: padel-web
   restart: unless-stopped
   ports:
     - "5173:80"
   depends_on:
     - api

volumes:
  padel_mysql_data:
