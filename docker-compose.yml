x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  mysql:
    image: mysql:8.4
    container_name: padel-mysql
    restart: unless-stopped
    environment:
      TZ: "America/Argentina/Buenos_Aires"
      MYSQL_DATABASE: "${MYSQL_DATABASE}"
      MYSQL_USER: "${MYSQL_USER}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - padel_mysql_data:/var/lib/mysql
      - ./database/docker-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$${MYSQL_ROOT_PASSWORD}" mysql -h localhost -uroot -Nse
          "SELECT COUNT(*) FROM information_schema.columns
          WHERE table_schema='$${MYSQL_DATABASE}'
          AND (
            (table_name='reservas' AND column_name='cliente_ocasional_nombre')
            OR (table_name='canchas' AND column_name='orden_visual')
            OR (table_name='torneo_partido_enlaces' AND column_name='id')
          )" | grep -qx 3
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging: *default-logging
    mem_limit: 1g
    cpus: 1.50
    pids_limit: 300
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: padel-api
    restart: unless-stopped
    environment:
      TZ: "America/Argentina/Buenos_Aires"
      DB_URL: "jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Argentina/Buenos_Aires"
      DB_USER: "${MYSQL_USER}"
      DB_PASSWORD: "${MYSQL_PASSWORD}"
      VENCIMIENTOS_INTERVALO_SEGUNDOS: "30"
      API_RECUPERACION_MOSTRAR_TOKEN: "false"
      API_COOKIES_SECURE: "${API_COOKIES_SECURE:-false}"
      API_WEB_PUBLICA_URL: "${API_WEB_PUBLICA_URL:-http://localhost:4321/}"
      SMTP_HOST: "${SMTP_HOST}"
      SMTP_PORT: "${SMTP_PORT}"
      SMTP_USER: "${SMTP_USER}"
      SMTP_PASSWORD: "${SMTP_PASSWORD}"
      SMTP_FROM_EMAIL: "${SMTP_FROM_EMAIL}"
      SMTP_FROM_NAME: "${SMTP_FROM_NAME}"
      SMTP_STARTTLS: "${SMTP_STARTTLS}"
      SMTP_SSL: "${SMTP_SSL}"
      SMTP_TIMEOUT_MS: "${SMTP_TIMEOUT_MS}"
      
      
      JAVA_TOOL_OPTIONS: "-Dapi.port=8080 -Dapi.cors.origen=${WEB_ORIGIN} -Duser.timezone=America/Argentina/Buenos_Aires"
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/api/publica/estado"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    depends_on:
      mysql:
        condition: service_healthy
    logging: *default-logging
    mem_limit: 768m
    cpus: 1.50
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777

  web:
   build:
     context: ./web-publica-v2
     dockerfile: Dockerfile
     args:
       PUBLIC_SITE_URL: "${PUBLIC_SITE_URL:-}"
   container_name: padel-web
   restart: unless-stopped
   ports:
     - "4321:80"
   depends_on:
     api:
       condition: service_healthy
   logging: *default-logging
   mem_limit: 256m
   cpus: 0.75
   pids_limit: 128
   security_opt:
     - no-new-privileges:true

volumes:
  padel_mysql_data:
