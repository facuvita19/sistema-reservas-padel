name: Calidad continua

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: calidad-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cambios:
    name: Detectar alcance
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      java: ${{ steps.filtros.outputs.java }}
      web: ${{ steps.filtros.outputs.web }}
      e2e: ${{ steps.filtros.outputs.e2e }}
      docker: ${{ steps.filtros.outputs.docker }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Clasificar cambios
        id: filtros
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          commit_available() { git cat-file -e "$1^{commit}" 2>/dev/null; }
          ensure_commit() {
            local sha="$1"
            commit_available "$sha" && return 0
            git fetch --no-tags origin "$sha" 2>/dev/null || true
            commit_available "$sha"
          }
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            files="__FULL__"
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            if [ -n "${BASE_SHA:-}" ] && ensure_commit "$BASE_SHA"; then
              files="$(git diff --name-only "$BASE_SHA" HEAD)"
            else
              echo "No se pudo resolver el commit base del pull request; se ejecutara validacion completa."
              files="__FULL__"
            fi
          elif [ -n "${BEFORE_SHA:-}" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            if ensure_commit "$BEFORE_SHA"; then
              files="$(git diff --name-only "$BEFORE_SHA" HEAD)"
            else
              echo "No se pudo resolver github.event.before; se ejecutara validacion completa."
              files="__FULL__"
            fi
          else
            files="$(git diff --name-only HEAD^ HEAD 2>/dev/null || git ls-files)"
          fi
          printf '%s\n' "$files"
          match() { printf '%s\n' "$files" | grep -Eq "$1"; }
          full=false; [ "$files" = "__FULL__" ] && full=true
          java=false; web=false; e2e=false; docker=false
          if $full || match '^(pom.xml|src/(main|test)/java/|src/main/resources/|database/)'; then java=true; fi
          if $full || match '^(web-publica-v2/(src/|public/|e2e/|package(-lock)?.json|astro.config.|tsconfig.json|playwright.config.))'; then web=true; fi
          if $full || match '^(web-publica-v2/(src/|public/|e2e/)|src/main/java/(api/publica|servicio)/|database/)'; then e2e=true; fi
          if $full || match '^(database/|docker-compose.yml|Dockerfile|web-publica-v2/Dockerfile|preparar-docker-init.ps1|validar-instalacion-limpia.ps1|auditar-secretos.ps1|probar-smtp.ps1|monitorear-salud.ps1|desplegar-seguro.ps1|validar-despliegue.ps1|rollback-seguro.ps1|backup-mysql.ps1|validar-restauracion-backup.ps1|validar-configuracion.ps1)'; then docker=true; fi
          echo "java=$java" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "e2e=$e2e" >> "$GITHUB_OUTPUT"
          echo "docker=$docker" >> "$GITHUB_OUTPUT"

  higiene:
    name: Higiene del repositorio
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Verificar espacios y conflictos
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git diff --check --root HEAD
          fi
      - name: Auditar secretos versionados
        shell: pwsh
        run: ./auditar-secretos.ps1

  java:
    name: Java 25 y Maven
    needs: cambios
    if: needs.cambios.outputs.java == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7
      - name: Configurar Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Ejecutar pruebas Java
        run: mvn --batch-mode --no-transfer-progress clean test
      - name: Publicar resultados Java si falla
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: resultados-java
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 3

  web:
    name: Astro y TypeScript
    needs: cambios
    if: needs.cambios.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web-publica-v2
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7
      - name: Configurar Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-publica-v2/package-lock.json
      - name: Instalar dependencias reproducibles
        run: npm ci
      - name: Validar Astro y TypeScript
        run: npm run check
      - name: Construir web publica
        run: npm run build

  e2e:
    name: Playwright E2E
    needs: cambios
    if: needs.cambios.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: web-publica-v2
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7
      - name: Configurar Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-publica-v2/package-lock.json
      - name: Instalar dependencias reproducibles
        run: npm ci
      - name: Instalar Chromium y dependencias
        run: npx playwright install --with-deps chromium
      - name: Ejecutar E2E proporcional
        timeout-minutes: 28
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$EVENT_NAME" = "pull_request" ]; then
            npm run test:e2e
          else
            npx playwright test --project=desktop-chromium --workers=2
          fi
      - name: Publicar reporte Playwright
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: reporte-playwright
          path: web-publica-v2/playwright-report/
          if-no-files-found: ignore
          retention-days: 3
      - name: Publicar evidencias si falla
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: evidencias-playwright
          path: web-publica-v2/test-results/
          if-no-files-found: ignore
          retention-days: 3

  docker-clean:
    name: Instalacion Docker limpia
    needs: cambios
    if: needs.cambios.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7
      - name: Preparar migraciones Docker
        shell: pwsh
        run: ./preparar-docker-init.ps1
      - name: Validar documentacion de continuidad
        shell: pwsh
        run: |
          $required = @("PLAN_DESARROLLO.md", "docs/CONTINUIDAD_DEL_PROYECTO.md")
          foreach ($file in $required) {
            if (-not (Test-Path $file)) { throw "Falta documento: $file" }
            if ((Get-Item $file).Length -lt 3000) { throw "Documento incompleto: $file" }
          }
          if (Select-String -Path $required -Pattern "localhost:5173" -Quiet) { throw "Referencia obsoleta al puerto 5173" }
      - name: Validar scripts operativos
        shell: pwsh
        run: |
          $files = @(
            "./probar-smtp.ps1", "./monitorear-salud.ps1", "./desplegar-seguro.ps1",
            "./validar-despliegue.ps1", "./rollback-seguro.ps1", "./backup-mysql.ps1",
            "./validar-restauracion-backup.ps1", "./validar-configuracion.ps1"
          )
          foreach ($file in $files) {
            $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile($file,[ref]$null,[ref]$errors) | Out-Null
            if ($errors.Count) { throw "Script invalido: $file" }
          }
      - name: Validar endurecimiento Compose
        run: |
          docker compose config --quiet
          grep -q "USER padel" Dockerfile.api
          grep -q "Content-Security-Policy" web-publica-v2/nginx.conf
      - name: Validar instalacion desde cero
        shell: pwsh
        run: ./validar-instalacion-limpia.ps1
